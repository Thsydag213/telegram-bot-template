# Бот + PostgreSQL одной командой:  docker compose up -d --build
# Настройки бота берутся из файла .env (скопируй .env.example).
# Адрес базы здесь задаётся автоматически — DATABASE_URL в .env не нужен.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
